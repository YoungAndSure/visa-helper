<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visa Helper · 材料清单</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: #172d36; background: #fff; }
    main { max-width: 720px; margin: auto; }
    h1 { margin: 0; font-size: 1.3rem; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    p { line-height: 1.55; }
    .muted { color: #617480; font-size: .88rem; }
    .notice { background: #fff6dc; border-radius: 10px; padding: 10px 12px; font-size: .85rem; }
    .panel { border: 1px solid #dce5e9; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .task { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e1e8ec; padding: 12px 0; }
    .task:last-child { border-bottom: 0; }
    .task-text { flex: 1; }
    .task small { display: block; margin-top: 4px; color: #617480; }
    button { border: 0; border-radius: 9px; background: #176e65; color: white; padding: 10px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #edf2f4; color: #203b45; }
    #error { color: #a13227; }
    #status { min-height: 1em; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    td, th { text-align: left; border-bottom: 1px solid #dce5e9; padding: 8px; vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; }
    label.check { display: block; margin: 12px 0; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .workspace-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .workspace-header h2 { margin: 0; }
    progress { width: 100%; height: 9px; accent-color: #176e65; }
    .guide-item { padding: 14px 0; border-bottom: 1px solid #dce5e9; break-inside: avoid; }
    .guide-item h3 { margin: 4px 0 8px; font-size: 1rem; }
    .guide-value { background: #edf6f3; color: #173c32; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .guide-instruction { line-height: 1.6; margin: 8px 0; }
    [hidden] { display: none !important; }
    a { color: #176e65; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a2831; color: #e7eff3; }
      .muted, .task small { color: #a8bdc9; }
      .notice { background: #3a3321; }
      .panel, .task { border-color: #35505f; }
      .secondary { background: #354b57; color: #e7eff3; }
      .guide-value { background: #244b41; color: #e7eff3; }
      .guide-item { border-color: #35505f; }
    }
  </style>
</head>
<body>
  <main data-build="material-checklist-v4">
    <h1>你的签证材料清单</h1>
    <p id="status" class="muted" role="status"></p>
    <p id="error" role="alert"></p>
    <div id="content"><p class="muted">正在读取材料清单…</p></div>
    <p id="version" class="muted">Visa Helper __VISA_APP_VERSION__ · 服务版本待确认</p>
  </main>
  <script type="module">
    const content = document.querySelector("#content");
    const errorEl = document.querySelector("#error");
    const statusEl = document.querySelector("#status");
    const versionEl = document.querySelector("#version");
    const embeddedVersion = "__VISA_APP_VERSION__";
    const embeddedUiHash = "__VISA_UI_SOURCE_HASH__";
    let runtimeInfo = null;
    let versionMismatch = false;
    let lastReceiptKey = null;
    let application = null;
    let latestTaskResult = null;
    let guideLink = null;
    let busy = false;
    let unsavedTask = false;
    let standardBridge = false;
    let hydrationStartedFor = null;
    let rpcId = 0;
    const pending = new Map();
    const notify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    const request = (method, params, timeoutMs = 30000) => new Promise((resolve, reject) => {
      const id = ++rpcId;
      const timeout = setTimeout(() => {
        pending.delete(id);
        reject(new Error("连接超时，请稍后重试。"));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timeout });
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    });

    function normalizeResult(raw) {
      const envelope = raw?.mcp_tool_result ?? raw?.call_tool_result ?? raw;
      if (envelope?.structuredContent || envelope?._meta || envelope?.isError) return envelope;
      if (envelope?.application || envelope?.serverInfo) return { structuredContent: envelope };
      return envelope;
    }
    async function hostRequest(method, params) {
      await ready;
      const fallback = () => {
        const host = window.openai;
        if (method === "tools/call" && typeof host?.callTool === "function") return host.callTool(params.name, params.arguments);
        if (method === "ui/message" && typeof host?.sendFollowUpMessage === "function") return host.sendFollowUpMessage({
          prompt: params.content.filter(({ type }) => type === "text").map(({ text }) => text).join("\n"),
        });
        if (method === "ui/update-model-context" && typeof host?.setWidgetState === "function") {
          host.setWidgetState({ modelContent: params.structuredContent, privateContent: {} });
          return {};
        }
        if (method === "ui/open-link" && typeof host?.openExternal === "function") return host.openExternal({ href: params.url });
        throw new Error("当前客户端不支持此操作，请在聊天中继续；已保存的进度仍在。");
      };
      if (!standardBridge) return normalizeResult(await fallback());
      try { return normalizeResult(await request(method, params)); }
      catch (error) {
        // A timeout is ambiguous: never repeat a potentially saved write.
        if (error?.code === -32601) return normalizeResult(await fallback());
        throw error;
      }
    }
    function applyResult(result) {
      result = normalizeResult(result);
      const info = result?.structuredContent?.serverInfo ?? result?._meta?.serverInfo;
      if (info) {
        runtimeInfo = info;
        versionMismatch = info.ui.sourceHash !== embeddedUiHash;
        versionEl.textContent = `界面 ${embeddedVersion} · 服务 ${info.version} · 构建 ${info.buildHash.slice(0, 12)} · UI ${embeddedUiHash.slice(0, 12)}`;
      }
      const fullState = result?._meta?.application ?? result?.structuredContent?.application;
      const returnedLink = result?.structuredContent?.guidePresentation ?? result?._meta?.guideLink;
      if (returnedLink) guideLink = returnedLink;
      if (fullState?.id) {
        latestTaskResult = result;
        unsavedTask = false;
        application = fullState.id === application?.id && fullState.status === "tasks_ready" && !Array.isArray(fullState.tasks)
          ? { ...application, ...fullState }
          : fullState;
      }
      if (result?.isError) throw new Error(result?.structuredContent?.error?.message ?? "操作失败，请重试。");
      render();
      if (application?.status === "tasks_ready" && !Array.isArray(application.tasks)) hydrate(application.id);
      if (!versionMismatch && application?.status === "tasks_ready" && Array.isArray(application.tasks) && runtimeInfo) {
        const receiptKey = `${application.id}:${application.updatedAt}:${runtimeInfo.buildHash}`;
        if (lastReceiptKey !== receiptKey) {
          lastReceiptKey = receiptKey;
          const receiptArgs = { applicationId: application.id, uiSourceHash: embeddedUiHash, buildHash: runtimeInfo.buildHash,
            applicationUpdatedAt: application.updatedAt };
          ready.then(async () => {
            const result = await hostRequest("tools/call", { name: "report_ui_ready", arguments: receiptArgs });
            if (result?.isError) throw new Error(result.structuredContent?.error?.message ?? "页面状态确认失败。");
          }).catch((error) => { lastReceiptKey = null; versionEl.textContent += ` · ${error.message}`; });
        }
      }
    }
    function hydrate(applicationId) {
      if (!applicationId || hydrationStartedFor === applicationId) return;
      hydrationStartedFor = applicationId;
      ready.then(async () => applyResult(await hostRequest("tools/call", {
        name: "get_task_queue", arguments: { applicationId },
      }))).catch((error) => { hydrationStartedFor = null; errorEl.textContent = error.message; });
    }
    window.addEventListener("message", (event) => {
      if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
      const message = event.data;
      if (typeof message.id === "number") {
        const waiting = pending.get(message.id);
        if (!waiting) return;
        clearTimeout(waiting.timeout);
        pending.delete(message.id);
        message.error ? waiting.reject(message.error) : waiting.resolve(message.result);
      } else if (message.method === "ui/notifications/tool-result") {
        try { applyResult(message.params); } catch (error) { errorEl.textContent = error.message; }
      } else if (message.method === "ui/notifications/tool-input") {
        hydrate(message.params?.arguments?.applicationId);
      }
    });
    const ready = request("ui/initialize", {
      appInfo: { name: "visa-helper-material-checklist", version: embeddedVersion },
      appCapabilities: {}, protocolVersion: "2026-01-26",
    }, typeof window.openai?.callTool === "function" ? 1500 : 15000).then(() => { standardBridge = true; notify("ui/notifications/initialized", {}); }).catch((error) => {
      if (typeof window.openai?.callTool === "function") return;
      throw error;
    });
    ready.catch((error) => { errorEl.textContent = error.message; });
    ready.then(() => {
      const resize = () => {
        const height = Math.ceil(document.querySelector("main").getBoundingClientRect().height) + 32;
        if (standardBridge) notify("ui/notifications/size-changed", { height });
        else window.openai?.notifyIntrinsicHeight?.(height);
      };
      new ResizeObserver(resize).observe(document.querySelector("main")); resize();
    }).catch(() => {});
    // Some ChatGPT mounts already have the initial result instead of replaying
    // a tool-result notification. Hydrate by the supplied ID, never ask for it.
    function readInitialHostState(event) {
      const changed = event?.detail?.globals;
      // setWidgetState also emits this event. Its background modelContent must
      // not replay the original toolOutput over a newly selected task.
      if (changed && !["toolInput", "toolOutput", "toolResponseMetadata"].some((key) => Object.hasOwn(changed, key))) return;
      const state = changed ? { ...window.openai, ...changed } : window.openai;
      const envelope = normalizeResult(state?.toolResponseMetadata);
      if (envelope?.structuredContent?.application || envelope?._meta?.application) applyResult(envelope);
      else if (state?.toolOutput?.application) applyResult({ structuredContent: state.toolOutput,
        _meta: envelope?._meta ?? state.toolResponseMetadata });
      if (!application) hydrate(state?.toolInput?.applicationId);
    }
    window.addEventListener("openai:set_globals", readInitialHostState);
    ready.then(readInitialHostState).catch(() => {});

    async function perform(action) {
      if (busy) return;
      busy = true;
      errorEl.textContent = "";
      statusEl.textContent = "正在处理，请稍候…";
      render();
      try { await ready; await action(); }
      catch (error) { errorEl.textContent = error?.message ?? "操作失败，请稍后重试。"; }
      finally { busy = false; render(); }
    }
    async function savePendingTask() {
      const flow = application?.taskFlow;
      if (!unsavedTask || !flow || flow.node === "done") return;
      applyResult(await hostRequest("tools/call", { name: "advance_task", arguments: {
        applicationId: application.id, taskId: flow.taskId, revision: flow.revision, data: flow.data,
      } }));
    }
    function startTask(task) {
      return perform(async () => {
        statusEl.textContent = `正在打开${task.title}…`;
        await savePendingTask();
        applyResult(await hostRequest("tools/call", {
          name: "start_task", arguments: { applicationId: application.id, taskId: task.id },
        }));
        if (application.activeTask?.id !== task.id || !application.taskFlow) throw new Error("任务未能载入，请在聊天中说明材料名称继续。");
        statusEl.textContent = `已进入${task.title}，正在请助手继续引导…`;
        await sendTaskMessage(task);
        content.querySelector(".panel")?.scrollIntoView({ block: "start", behavior: "smooth" });
      });
    }
    function pauseTask(task) {
      return perform(async () => {
        await savePendingTask();
        applyResult(await hostRequest("tools/call", { name: "start_task", arguments: {
          applicationId: application.id, taskId: task.id, action: "pause",
        } }));
        statusEl.textContent = task.status === "done" ? "已返回材料清单。" : "已暂停并保存进度。可以选择其他材料，之后再回来继续。";
        await syncTaskContext();
      });
    }
    async function syncTaskContext() {
      const handoff = latestTaskResult?.structuredContent?.handoff;
      if (!handoff || handoff.applicationId !== application?.id) throw new Error("任务已保存，但未取得助手上下文，请重新读取材料清单。");
      const result = await hostRequest("ui/update-model-context", { structuredContent: handoff });
      if (result?.isError) throw new Error("任务已保存，但客户端未能同步助手上下文。可以继续使用页卡，或在聊天中选择材料名称。");
    }
    async function sendTaskMessage(task, label) {
      // Publish the MCP response first. Never put its internal references into a
      // user message, even as a fallback when a host lacks background context.
      await syncTaskContext();
      const result = await hostRequest("ui/message", {
        role: "user", content: [{ type: "text", text: label ?? `${task.status === "done" ? "查看" : "准备"}${task.title}` }],
      });
      if (result?.isError) throw new Error("任务已打开，但未能通知助手。请在聊天中说“继续当前材料”；已保存的进度仍在。");
      statusEl.textContent = `已打开${task.title}，并已向当前聊天发送继续准备的请求。你也可以直接使用下方任务步骤。`;
    }
    function continueInChat(task, label) { return perform(() => sendTaskMessage(task, label)); }
    function taskEvent(event, data) {
      return perform(async () => {
        const flow = application.taskFlow;
        applyResult(await hostRequest("tools/call", { name: "advance_task", arguments: {
          applicationId: application.id, taskId: flow.taskId, revision: flow.revision,
          event, data: data ?? flow.data,
        } }));
        if (event === "FINISH") statusEl.textContent = "这项材料已完成。请选择下一项材料，也可以继续之前暂停的材料。";
        await syncTaskContext();
      });
    }
    function downloadGuide(flow) {
      return perform(async () => {
        statusEl.textContent = "正在读取最新的填写对照页链接…";
        const latest = await hostRequest("tools/call", { name: "advance_task", arguments: {
          applicationId: application.id, taskId: flow.taskId,
        } });
        applyResult(latest);
        const link = latest.structuredContent?.guidePresentation ?? latest._meta?.guideLink ?? guideLink;
        const html = latest._meta?.guideDocument;
        if (!html && !link?.url) throw new Error("未取得填写指引，请刷新任务进度后重试。");
        const contents = html ? [{ type: "resource", resource: {
          uri: `file:///${flow.taskId}-guide.html`, mimeType: "text/html", text: html,
        } }] : [{ type: "resource_link", uri: link.url, name: `${flow.taskId}-guide.html`, mimeType: "text/html" }];
        const result = await hostRequest("ui/download-file", { contents });
        if (result?.isError) throw new Error("下载未获允许，可在浏览器打开填写对照页查看或复制。");
        statusEl.textContent = "已请求下载网页版对照表。";
      });
    }
    async function materialPath(event, task) {
      await taskEvent(event);
      const labels = { self_check: `自行检查${task.title}`, await_upload: `上传检查${task.title}`, acquiring: `了解${task.title}的准备方式` };
      if (labels[application.taskFlow?.node]) await continueInChat(task, labels[application.taskFlow.node]);
    }
    function renderGuideControls(panel, flow, task) {
      const known = flow.guide.filter((field) => field.value !== null).length;
      panel.append(element("p", `已整理 ${known} 项填写内容，其余项目提供填写说明。`));
      const link = element("a", "打开填写对照页");
      link.href = guideLink?.url ?? "#"; link.target = "_blank"; link.rel = "noreferrer";
      if (!guideLink?.url) link.addEventListener("click", (event) => {
        event.preventDefault(); errorEl.textContent = "暂未取得网页链接，请在当前聊天中说“打开填写对照页”。";
      });
      panel.append(link, element("p", "网页中的未知项目会保留填写说明。临时链接15分钟有效，过期后刷新任务进度取得新链接。", "muted"));
      panel.append(button("下载网页版对照表", () => downloadGuide(flow), "secondary"));
    }
    function renderMaterialFlow(panel, flow, task) {
      const passport = flow.taskId === "passport";
      panel.append(element("h2", flow.nextAction.title));
      const guidance = {
        prepare: flow.document ? "先整理已有信息，打开填写指引或草稿；你也可以直接使用已经准备好的材料。" : "可以上传材料请助手协助检查，也可以由助手提问、自己查看后确认。",
        acquiring: "按下面的指引取得真实材料。取得后回来继续检查，可以暂停并保留进度。",
        filling: "对照网页补齐真实信息，按要求自行填写或交由出具方确认。草稿生成不代表正式材料已准备好。",
        review_choice: "材料准备好后，可以按清单自己检查，也可以自愿上传请助手协助检查。",
        self_check: "请按下面的问题检查实际材料，确认后勾选。也可以在聊天中直接告诉助手检查结果，无需上传。",
        await_upload: "如果愿意，请在当前聊天中上传清晰照片或文档。可以随时改为不上传、自行检查。",
        assisted_check: "请核对助手的检查结果和提取内容，补充照片无法判断的部分。有问题先处理，再确认完成。",
        done: "这项材料已准备好。需要更新时可以重新打开并检查。",
      };
      panel.append(element("p", guidance[flow.node] ?? flow.nextAction.title));
      if (passport) panel.append(element("p", "无需提供姓名或护照号码。", "muted"));
      for (const text of flow.requirements) panel.append(element("p", text));
      if (flow.acquisition.length) {
        const details = element("details", ""); details.open = flow.node === "acquiring";
        details.append(element("summary", "如何取得或准备这项材料"));
        for (const text of flow.acquisition) details.append(element("p", text));
        panel.append(details);
      }
      if (flow.document) renderGuideControls(panel, flow, task);
      if (flow.needsRecheck) panel.append(element("p", "申请资料已变化，旧检查和完成确认已清除，请重新核对。", "notice"));
      for (const check of flow.automaticChecks) {
        const label = flow.checkCatalog.find(({ id }) => id === check.id)?.label;
        const status = { pass: "已提供的信息符合此项规则", fail: "已提供的信息不符合要求，请处理后重新检查", unknown: "信息尚不完整，请按提示核对" }[check.status];
        panel.append(element("p", `${label}：${status}${check.limitDate ? `（核对界限：${check.limitDate}）` : ""}`, check.status === "fail" ? "notice" : "muted"));
      }
      const checkbox = (label, checked, change) => {
        const wrapper = element("label", "", "check"), input = document.createElement("input");
        input.type = "checkbox"; input.checked = checked; input.disabled = busy || versionMismatch;
        input.addEventListener("change", () => { change(input.checked); unsavedTask = true; });
        wrapper.append(input, document.createTextNode(` ${label}`)); panel.append(wrapper);
      };
      if (flow.node === "self_check") for (const check of flow.checkCatalog) {
        panel.append(element("p", check.question ?? check.label));
        checkbox(check.label, flow.data.checks[check.id] === true, (value) => { flow.data.checks[check.id] = value; });
      }
      if (flow.node === "assisted_check") {
        for (const field of flow.fieldCatalog) panel.append(element("p", `${field.label}：${flow.data.fields[field.id] ?? "尚未提供或未读清，请按需要补充"}`));
        for (const coverage of flow.requiredCoverage) panel.append(element("p", `${coverage.label}：${flow.data.review?.coverage?.includes(coverage.id) ? "助手已报告读取" : "尚未报告读取"}`, "muted"));
        for (const finding of flow.data.review?.findings ?? []) panel.append(element("p", finding.message, finding.severity === "note" ? "muted" : "notice"));
        checkbox(passport ? "我已核对助手提取的签发和到期日期，信息正确" : "我已核对助手的检查结果及提取信息", flow.data.confirmedDetails, (value) => { flow.data.confirmedDetails = value; });
        for (const check of flow.checkCatalog.filter(({ evidence }) => evidence === "user")) {
          checkbox(passport ? "我已翻看护照，确认至少有2页空白页" : check.label, flow.data.checks[check.id] === true, (value) => { flow.data.checks[check.id] = value; });
        }
      }
      const actions = element("div", "", "actions");
      const events = flow.nextAction.events;
      if (events.includes("GUIDE_READY")) actions.append(button("使用填写指引或草稿", () => taskEvent("GUIDE_READY")));
      if (events.includes("FILLED")) actions.append(button("材料已准备，选择检查方式", () => taskEvent("FILLED")));
      if (events.includes("ACQUIRE")) actions.append(button("还没有材料，查看准备指引", () => materialPath("ACQUIRE", task), "secondary"));
      if (events.includes("READY")) actions.append(button("已取得材料，开始检查", () => taskEvent("READY")));
      if (events.includes("SELF_CHECK")) actions.append(button("不上传，自己检查", () => materialPath("SELF_CHECK", task), "secondary"));
      if (events.includes("ASSISTED_CHECK")) actions.append(button("拍照上传，让助手检查", () => materialPath("ASSISTED_CHECK", task), "secondary"));
      if (["self_check", "assisted_check"].includes(flow.node)) {
        checkbox(passport ? "我确认护照原件及按清单要求的递交材料已准备好" : "我确认这项材料及要求的原件、副本或签署已准备好", flow.data.prepared, (value) => { flow.data.prepared = value; });
        actions.append(button("保存检查进度", () => taskEvent(undefined), "secondary"));
        actions.append(button(passport ? "确认完成护照任务" : "确认完成这项材料", () => taskEvent("FINISH")));
      }
      if (events.includes("RETRY")) actions.append(button("重新上传检查", () => materialPath("RETRY", task), "secondary"));
      if (events.includes("EDIT")) actions.append(button(passport ? "更新证件并重新检查" : "修改材料并重新检查", () => taskEvent("EDIT"), "secondary"));
      if (flow.node === "done") panel.append(element("p", flow.confirmation?.method === "user_self_check" ? "已完成 · 用户自行检查并确认。" : "已完成 · 辅助检查后由用户确认。"));
      actions.append(button(flow.document && ["prepare", "filling"].includes(flow.node) ? "让助手打开填写对照页" : "在对话中继续", () => continueInChat(task, flow.document && ["prepare", "filling"].includes(flow.node) ? "打开填写对照页" : `继续准备${task.title}`), "secondary"));
      actions.append(button("刷新任务进度", () => perform(async () => applyResult(await hostRequest("tools/call", {
        name: "advance_task", arguments: { applicationId: application.id, taskId: flow.taskId },
      }))), "secondary"));
      panel.append(actions);
    }
    function renderTaskFlow(panel, flow, task) {
      if (flow.policy !== "form") return renderMaterialFlow(panel, flow, task);
      const original = element("a", "下载原始申请表 PDF");
      original.href = flow.source.formUrl; original.target = "_blank"; original.rel = "noopener noreferrer";
      original.addEventListener("click", (event) => {
        event.preventDefault();
        perform(async () => {
          const result = await hostRequest("ui/open-link", { url: flow.source.formUrl });
          if (result?.isError) throw new Error("打开链接未获允许，请在聊天中索取原表链接。");
        });
      });
      panel.append(original, element("p", "可自行手写或用软件填写；无需先提供个人资料，也无需上传表格。", "muted"));
      const stepGuidance = {
        prepare: "先看看每一项需要填什么。已有的申请信息会整理到填写对照页中，不确定的内容可以在对话中补充。",
        filling: "打开填写对照页，一边对照，一边填写原始申请表。你可以使用软件，也可以打印后手写。",
        review_choice: "表格填好后，可以按清单自行核对，也可以自愿上传，让助手协助检查。",
        self_check: "请逐项核对下面的内容，确认表格已填妥并签字。无需上传表格。",
        await_upload: "如果愿意，请在当前聊天中上传 PDF 或清晰照片。也可以随时改为自行检查。",
        assisted_check: "请查看检查结果并处理提示的问题，最后确认表格已填妥并签字。",
        done: "这项材料已准备好。需要修改时，可以重新打开并核对。",
      };
      panel.append(element("h2", flow.nextAction.title), element("p", stepGuidance[flow.node] ?? flow.nextAction.title));
      if (flow.needsRecheck) panel.append(element("p", "申请资料已变化，请重新核对填写内容；旧检查和完成确认已清除。", "notice"));
      renderGuideControls(panel, flow, task);
      const actions = element("div", "", "actions");
      if (flow.nextAction.events.includes("GUIDE_READY")) actions.append(button("使用填写指引", () => taskEvent("GUIDE_READY")));
      if (flow.nextAction.events.includes("FILLED")) actions.append(button("我已填好，选择检查方式", () => taskEvent("FILLED", { ...flow.data, filled: true })));
      if (flow.nextAction.events.includes("SELF_CHECK")) actions.append(button("不上传，自己检查", () => materialPath("SELF_CHECK", task), "secondary"));
      if (flow.nextAction.events.includes("ASSISTED_CHECK")) actions.append(button("自愿上传，请协助检查", () => materialPath("ASSISTED_CHECK", task), "secondary"));
      const checkbox = (label, checked, change) => {
        const wrapper = element("label", "", "check");
        const input = document.createElement("input"); input.type = "checkbox"; input.checked = checked;
        input.disabled = busy || versionMismatch; input.addEventListener("change", () => { change(input.checked); unsavedTask = true; });
        wrapper.append(input, document.createTextNode(` ${label}`)); panel.append(wrapper);
      };
      if (flow.node === "self_check") {
        for (const check of flow.checkCatalog) checkbox(check.label, flow.data.checks[check.id] === true,
          (value) => { flow.data.checks[check.id] = value; });
      }
      if (["self_check", "assisted_check"].includes(flow.node)) {
        if (flow.data.review && flow.node === "assisted_check") {
          panel.append(element("p", `助手报告已读取第 ${flow.data.review.pages.join("、")} 页。此结果不代表签证机构审核通过。`, "muted"));
          for (const finding of flow.data.review.findings) panel.append(element("p", finding.message, finding.severity === "note" ? "muted" : "notice"));
        }
        checkbox("我确认申请表已填妥", flow.data.filled, (value) => { flow.data.filled = value; });
        checkbox("我已阅读声明，并已按要求在原表上签字", flow.data.signed, (value) => { flow.data.signed = value; });
        actions.append(button("确认完成这项材料", () => taskEvent("FINISH")));
      }
      if (flow.nextAction.events.includes("RETRY")) actions.append(button("修正后重新上传检查", () => taskEvent("RETRY"), "secondary"));
      if (flow.nextAction.events.includes("EDIT")) actions.append(button("返回修改并重新核对", () => taskEvent("EDIT"), "secondary"));
      if (flow.node === "done") panel.append(element("p", flow.confirmation?.method === "user_self_check"
        ? "已完成 · 用户自行检查并确认。" : "已完成 · 辅助检查后由用户确认。"));
      actions.append(button(["prepare", "filling"].includes(flow.node) ? "让助手打开填写对照页" : "在对话中继续", () => continueInChat(task, flow.document && ["prepare", "filling"].includes(flow.node) ? "打开填写对照页" : `继续准备${task.title}`), "secondary"));
      actions.append(button("刷新任务进度", () => perform(async () => applyResult(await hostRequest("tools/call", {
        name: "advance_task", arguments: { applicationId: application.id, taskId: flow.taskId },
      }))), "secondary"));
      panel.append(actions);
    }
    function element(tag, text, className = "") {
      const node = document.createElement(tag);
      node.textContent = text;
      node.className = className;
      return node;
    }
    function button(label, action, className = "") {
      const node = element("button", label, className);
      node.type = "button";
      node.disabled = busy || versionMismatch;
      node.addEventListener("click", action);
      return node;
    }
    function render() {
      if (versionMismatch) {
        content.replaceChildren(element("p", "当前界面与服务端版本不一致，已暂停材料操作。请重新载入清单；现有申请数据已保留。", "notice"));
        return;
      }
      if (!application) return;
      content.replaceChildren();
      if (application.status !== "tasks_ready") {
        content.append(element("p", "申请信息需要补充或更正。请继续在对话中回答问题，完成后会更新材料清单。"));
        return;
      }
      if (!Array.isArray(application.tasks)) {
        content.append(element("p", "请重新打开材料清单以载入完整任务。"));
        content.append(button("重新读取", () => perform(async () => applyResult(await hostRequest("tools/call", {
          name: "get_task_queue", arguments: { applicationId: application.id },
        })))));
        return;
      }
      const activeTask = application.activeTask;
      document.querySelector("h1").textContent = activeTask ? activeTask.title : "你的签证材料清单";
      const completed = application.tasks.filter((task) => task.status === "done").length;
      const header = element("div", "", "workspace-header");
      if (activeTask) {
        header.append(element("h2", "当前任务"), button("全部任务", () => pauseTask(activeTask), "secondary"));
      } else {
        header.append(element("h2", `已完成 ${completed} / ${application.tasks.length} 项材料`));
      }
      content.append(header);
      const taskProgress = activeTask && application.taskFlow?.progress;
      if (taskProgress) {
        const index = taskProgress.stages.findIndex(({ id }) => id === taskProgress.currentStage);
        const label = taskProgress.complete ? "本项材料已完成"
          : `阶段 ${index + 1} / ${taskProgress.totalStages} · ${taskProgress.stages[index].label}`;
        content.append(element("p", label, "muted"));
        const progress = document.createElement("progress"); progress.max = taskProgress.totalStages; progress.value = taskProgress.completedStages;
        progress.setAttribute("aria-label", "当前任务阶段进度"); progress.setAttribute("aria-valuetext", label); content.append(progress);
        content.append(element("p", taskProgress.stages.map(({ label }) => label).join(" → "), "muted"));
      } else if (!activeTask) {
        const progress = document.createElement("progress"); progress.max = application.tasks.length; progress.value = completed;
        progress.setAttribute("aria-label", "材料准备完成进度"); content.append(progress);
      }
      if (!activeTask) content.append(element("p", "选择一项材料开始准备。"));
      const recommended = activeTask ?? application.tasks.find((task) => task.status !== "done");
      if (recommended) {
        const next = element("section", "", "panel");
        next.append(element("h2", activeTask ? `正在准备：${activeTask.title}` : `下一步：${recommended.title}`));
        if (activeTask) {
          const method = { form: "填写并核对表格，按要求整理成文件。", collect: "取得或整理这项材料，核对后按要求准备原件或副本。", draft: "根据已确认的行程资料起草并核对文件。" }[activeTask.handling];
          if (method) next.append(element("p", method));
          if (activeTask.note) next.append(element("p", activeTask.note));
          next.append(button("保存并暂停，准备其他材料", () => pauseTask(activeTask), "secondary"));
          if (application.taskFlow) renderTaskFlow(next, application.taskFlow, activeTask);
          else {
            next.append(element("p", "下一步在对话中继续准备这项材料。这项材料的独立流程尚未开放。", "muted"));
            next.append(button("在对话中继续准备", () => continueInChat(activeTask)));
          }
        } else {
          next.append(button(recommended.status === "paused" ? "继续准备" : "开始准备", () => startTask(recommended)));
        }
        content.append(next);
      }
      const list = element("section", "", "panel");
      list.id = "all-tasks"; list.hidden = Boolean(activeTask);
      list.append(element("h2", "全部材料"));
      application.tasks.forEach((task, index) => {
        const row = element("div", "", "task");
        const text = element("div", "", "task-text");
        text.append(element("strong", `${index + 1}. ${task.title}`));
        text.append(element("small", task.status === "done" ? "已完成" : task.status === "paused" ? "已暂停 · 进度已保存" : task.status === "in_progress" ? "准备中" : "待准备"));
        row.append(text, button(task.id === activeTask?.id ? "查看当前项" : task.status === "paused" ? "继续准备" : task.status === "done" ? "查看材料" : "开始准备", () => startTask(task), "secondary"));
        list.append(row);
      });
      content.append(list);
      if (!activeTask) {
        for (const note of application.reviewNotes ?? []) content.append(element("p", `待核实：${note}`, "notice"));
        content.append(element("p", "情况有变化？直接在对话中说明，材料清单会随答案重新计算。", "muted"));
      }
    }
  </script>
</body>
</html>
