<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visa Helper</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #f4f7fa; color: #152534; }
    main { max-width: 650px; margin: auto; background: #fff; border: 1px solid #d9e3ea; border-radius: 18px; padding: 22px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 1.4rem; margin: 0; }
    h2 { font-size: 1.1rem; margin: 22px 0 8px; }
    p { line-height: 1.55; }
    .badge { border-radius: 999px; padding: 5px 10px; background: #e5f3ef; color: #126b54; font-size: .8rem; white-space: nowrap; }
    .muted { color: #607284; font-size: .88rem; }
    .notice { background: #fff6dc; border: 1px solid #efdca5; border-radius: 12px; padding: 12px; font-size: .9rem; }
    .panel { background: #f7f9fb; border-radius: 12px; padding: 14px; margin-top: 14px; }
    .task { border-bottom: 1px solid #d9e3ea; padding: 12px 0; }
    .task:last-child { border-bottom: 0; }
    .task strong { display: block; }
    .task small { display: block; margin-top: 4px; color: #607284; line-height: 1.45; }
    label { display: block; margin: 12px 0; font-size: .9rem; font-weight: 600; }
    input, select { display: block; width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #b9c9d5; border-radius: 9px; font: inherit; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    button { background: #176e65; border: 0; border-radius: 10px; color: white; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #eaf0f3; color: #213848; }
    #error { color: #a13227; min-height: 1.4em; }
    @media (prefers-color-scheme: dark) {
      body { background: #111b22; color: #e7eff3; }
      main { background: #1a2831; border-color: #35505f; }
      .muted, .task small { color: #a8bdc9; }
      .panel { background: #213641; }
      .notice { background: #3a3321; border-color: #796637; }
      input, select { background: #13232c; color: white; border-color: #526c79; }
      .secondary { background: #354b57; color: #e7eff3; }
      .task { border-color: #35505f; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>Visa Helper</h1><span class="badge">冰岛旅游模拟</span></header>
    <p class="muted">聊聊你的出行计划，我们会据此整理需要准备的材料。</p>
    <div class="notice">使用 2025 年审核表的模拟规则，尚未核实为现行要求。请勿输入真实个人资料或用于正式申请。</div>
    <div id="content"></div>
    <p id="error" role="alert"></p>
  </main>
  <script type="module">
    const content = document.querySelector("#content");
    const errorEl = document.querySelector("#error");
    let application = null;
    let activeQuestionId = null;
    let busy = false;
    let rpcId = 0;
    const pending = new Map();
    const notify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    const request = (method, params) => new Promise((resolve, reject) => {
      const id = ++rpcId;
      pending.set(id, { resolve, reject });
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    });
    function applyResult(result) {
      const data = result?.structuredContent;
      if (data?.application) {
        const previousQuestionId = activeQuestionId;
        application = data.application;
        if (application.status === "questions") {
          const remaining = application.questions.filter((question) => application.answers?.[question.id] === undefined);
          activeQuestionId = remaining.find((question) => question.id !== previousQuestionId)?.id ?? remaining[0]?.id ?? null;
        } else if (application.status === "needs_correction") {
          activeQuestionId = previousQuestionId;
        } else {
          activeQuestionId = null;
        }
        try { localStorage.setItem("visa-helper-application-id", application.id); } catch {}
      }
      if (data?.error) errorEl.textContent = data.error.message;
      render();
    }
    window.addEventListener("message", (event) => {
      if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
      const message = event.data;
      if (typeof message.id === "number") {
        const waiting = pending.get(message.id);
        if (!waiting) return;
        pending.delete(message.id);
        message.error ? waiting.reject(message.error) : waiting.resolve(message.result);
      } else if (message.method === "ui/notifications/tool-result") {
        applyResult(message.params);
      }
    });
    const ready = request("ui/initialize", {
      appInfo: { name: "visa-helper-ui", version: "0.2.0" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    }).then(() => notify("ui/notifications/initialized", {}));

    async function call(name, args) {
      if (busy) return;
      busy = true;
      errorEl.textContent = "";
      render();
      try {
        await ready;
        applyResult(await request("tools/call", { name, arguments: args }));
      } catch (error) {
        errorEl.textContent = error?.message ?? "操作失败，请稍后重试。";
      } finally {
        busy = false;
        render();
      }
    }

    function element(tag, value, className = "") {
      const node = document.createElement(tag);
      node.textContent = value;
      node.className = className;
      return node;
    }
    function button(label, action, className = "") {
      const node = element("button", label, className);
      node.type = "button";
      node.disabled = busy;
      node.addEventListener("click", action);
      return node;
    }
    function render() {
      content.replaceChildren();
      if (!application) {
        content.append(element("h2", "开始一次模拟申请"));
        content.append(element("p", "每次只处理一位申请人。你可以按页卡逐个回答问题，也可以在当前对话中一口气说出旅行计划；我们会根据你提供的信息查缺补漏。"));
        content.append(element("p", "例如可以说明护照国籍、居住地、递交城市、目的地、日期、年龄和职业。只说你确定的信息即可。", "muted"));
        content.append(button("开始", () => call("create_application", {})));
        const resume = document.createElement("form");
        resume.className = "panel";
        const label = element("label", "已有申请 ID");
        const input = document.createElement("input");
        input.name = "applicationId";
        input.placeholder = "粘贴申请 ID";
        input.required = true;
        label.append(input);
        const submit = element("button", "恢复申请", "secondary");
        submit.type = "submit";
        resume.append(label, submit);
        resume.addEventListener("submit", (event) => {
          event.preventDefault();
          call("get_application", { applicationId: input.value.trim() });
        });
        try { input.value = localStorage.getItem("visa-helper-application-id") ?? ""; } catch {}
        content.append(resume);
        return;
      }
      content.append(element("p", `申请 ID：${application.id}`, "muted"));
      if (application.status === "legacy_walkthrough") {
        content.append(element("div", application.notice, "panel"));
        content.append(button("新建模拟申请", () => call("create_application", {})));
        return;
      }
      if (application.reason) content.append(element("div", application.reason, "panel"));
      if (application.status === "questions" || application.status === "needs_correction") {
        const group = application.questionGroup;
        const questions = application.questions;
        const question = questions.find((item) => item.id === activeQuestionId) ?? questions.find((item) => application.answers?.[item.id] === undefined) ?? questions[0];
        const position = questions.findIndex((item) => item.id === question.id);
        const answered = questions.filter((item) => application.answers?.[item.id] !== undefined).length;
        content.append(element("h2", group.title));
        content.append(element("p", `本组已回答 ${answered}/${group.total} 题 · 当前第 ${position + 1} 题`, "muted"));
        content.append(element("p", "也可以在当前对话中一次写出旅行计划；我们只会追问缺少的信息。", "muted"));
        const form = document.createElement("form");
        form.className = "panel";
        const label = element("label", question.title);
        let input;
        if (question.type === "choice") {
          input = document.createElement("select");
          input.append(new Option("请选择", ""));
          question.options.forEach((option) => input.append(new Option(option.label, option.value)));
        } else {
          input = document.createElement("input");
          input.type = question.type === "date" ? "date" : "text";
        }
        input.name = question.id;
        input.value = application.answers?.[question.id] ?? "";
        input.required = true;
        label.append(input);
        form.append(label);
        const actions = document.createElement("div");
        actions.className = "actions";
        const submit = element("button", "保存并继续");
        submit.type = "submit";
        actions.append(submit);
        if (position > 0) actions.append(button("上一题", () => { activeQuestionId = questions[position - 1].id; render(); }, "secondary"));
        if (position < questions.length - 1) actions.append(button("下一题", () => { activeQuestionId = questions[position + 1].id; render(); }, "secondary"));
        form.append(actions);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          call("submit_answers", { applicationId: application.id, answers: { [question.id]: input.value.trim() } });
        });
        content.append(form);
        return;
      }
      if (application.status === "tasks_ready") {
        content.append(element("h2", `文件任务队列（${application.tasks.length} 项）`));
        content.append(element("p", "这是根据你的回答整理出的材料。逐项准备文件的功能将在下一阶段开放。", "muted"));
        const list = document.createElement("div");
        list.className = "panel";
        for (const task of application.tasks) {
          const row = document.createElement("div");
          row.className = "task";
          row.append(element("strong", `${task.title} · 原表第 ${task.checklistItem} 项`));
          if (task.note) row.append(element("small", task.note));
          list.append(row);
        }
        content.append(list);
        for (const note of application.reviewNotes) content.append(element("p", `待核实：${note}`, "notice"));
        content.append(element("p", "如需更正情况，请在对话中说明，助手会更新答案并重新生成队列。", "muted"));
      }
    }
    render();
  </script>
</body>
</html>
