<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>visa-helper · 材料审核</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="mark">🛂</div>
        <div>
          <h1>visa-helper <span class="tag">材料审核</span></h1>
          <p class="tagline">为申根 / 北欧签证材料做清单核对 · 本地运行 · 不外传文件</p>
        </div>
      </div>
    </div>
    <div class="subnav">
      <div class="subnav__inner">
        <span>本页面与后端同源部署 · 文件仅在本地读取</span>
        <span id="health" class="health health--unknown" title="后端状态">
          <span class="dot"></span><span class="health__text">检测中…</span>
        </span>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- 左栏：选择 & 运行 -->
    <section class="panel" aria-label="选择材料">
      <h2 class="panel__title">
        <span class="step">1</span> 选择国家 <small>自动拉清单</small>
      </h2>
      <select id="country" class="control">
        <option value="IS">🇮🇸 冰岛 (IS)</option>
        <option value="NO">🇳🇴 挪威 (NO)</option>
      </select>

      <h2 class="panel__title">
        <span class="step">2</span> 选择材料 <small>本地读取</small>
      </h2>
      <p class="hint">
        📁 选一个材料文件夹。<strong>文件仅在浏览器本地读取</strong>，不会上传；
        后端只收到国家、目录名等元信息，真实审核逻辑后续实装。
      </p>
      <label class="filepick">
        <input id="picker" type="file" webkitdirectory multiple hidden />
        <span class="btn btn--ghost">📂 选择材料文件夹…</span>
      </label>
      <ul id="filelist" class="filelist" aria-live="polite"></ul>

      <label class="field">
        <span class="field__label">材料目录（发给后端）</span>
        <input id="materialsDir" class="control" type="text"
               placeholder="/Users/you/Code/visa-helper/iceland" />
      </label>

      <label class="checkbox">
        <input id="useLlm" type="checkbox" />
        <span>用 LLM 二次核对每项内容（较慢）</span>
      </label>

      <button id="runBtn" class="btn btn--primary">▶ 运行审核</button>
      <p id="runStatus" class="runstatus" aria-live="polite"></p>
    </section>

    <!-- 右栏：清单预览 + 结果 -->
    <section class="panel panel--wide" aria-label="清单与结果">
      <div class="tabs">
        <button class="tab tab--active" data-tab="checklist">📋 要求清单</button>
        <button class="tab" data-tab="results">✅ 审核结果</button>
      </div>

      <div id="tab-checklist" class="tabpane tabpane--active">
        <div id="checklistMeta" class="meta"></div>
        <ol id="checklist" class="checklist"></ol>
      </div>

      <div id="tab-results" class="tabpane">
        <div id="summary" class="summary"></div>
        <div id="warnings" class="warnings"></div>
        <div id="results" class="results"></div>
        <details id="reportWrap" class="report" hidden>
          <summary>查看 Markdown 报告原文</summary>
          <pre id="reportRaw"></pre>
        </details>
        <div id="resultsEmpty" class="empty">
          <span class="icon">📭</span>
          还没有结果，点击左侧「运行审核」。
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js" type="module"></script>
</body>
</html>
